name: game-ai-digest

on:
  schedule:
    # KST 08:23부터 21:53까지 90분 간격으로 하루 10회 실행한다.
    # UTC 기준: 08:23/11:23/14:23/17:23/20:23 KST
    - cron: "23 2,5,8,11,23 * * *"
    # UTC 기준: 09:53/12:53/15:53/18:53/21:53 KST
    - cron: "53 0,3,6,9,12 * * *"
  workflow_dispatch:
    inputs:
      send_promo_now:
        description: "다음 자매 채널 홍보만 즉시 발송"
        required: false
        type: boolean
        default: false
      send_channel_guide_now:
        description: "고정용 채널 안내를 상태 변경 없이 즉시 발송"
        required: false
        type: boolean
        default: false
      preview_send:
        description: "기존 기사를 상태 변경 없이 테스트 발송"
        required: false
        type: boolean
        default: false
      preview_limit:
        description: "테스트 기사 수 (1~3)"
        required: false
        type: choice
        options:
          - "1"
          - "2"
          - "3"
        default: "1"

concurrency:
  group: game-ai-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

      - name: Collect and send digest
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          SEND_PROMO_NOW: ${{ inputs.send_promo_now || 'false' }}
          SEND_CHANNEL_GUIDE_NOW: ${{ inputs.send_channel_guide_now || 'false' }}
          PREVIEW_SEND: ${{ inputs.preview_send || 'false' }}
          PREVIEW_LIMIT: ${{ inputs.preview_limit || '1' }}
        run: |
          if [ "$SEND_CHANNEL_GUIDE_NOW" = "true" ]; then
            python main.py --send-channel-guide
          elif [ "$SEND_PROMO_NOW" = "true" ]; then
            python main.py --send-promo-now
          elif [ "$PREVIEW_SEND" = "true" ]; then
            python main.py --preview-send --limit "$PREVIEW_LIMIT"
          else
            python main.py
          fi

      - name: Commit read state
        # 여러 게시물 중 일부만 성공한 경우에도 성공분의 상태를 보존해 중복 발송을 막는다.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/news_state.json
          if ! git diff --cached --quiet; then
            git commit -m "상태 업데이트"
            for i in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push && break
              sleep 5
            done
          fi
