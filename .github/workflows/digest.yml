name: game-ai-digest

on:
  schedule:
    # 매일 08:23 KST. 정각대 혼잡을 피해 약간 늦춘다.
    - cron: "23 23 * * *"
  workflow_dispatch: {}

concurrency:
  group: game-ai-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

      - name: Collect and send digest
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: python main.py

      - name: Commit read state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/news_state.json
          if ! git diff --cached --quiet; then
            git commit -m "상태 업데이트"
            for i in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push && break
              sleep 5
            done
          fi
